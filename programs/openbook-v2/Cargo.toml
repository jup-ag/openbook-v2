cargo-features = ["workspace-inheritance"]

[package]
description = "Created with Anchor"
edition = "2021"
name = "openbook-v2"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "openbook_v2"

[features]
cpi = ["no-entrypoint"]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
test-bpf = ["client"]
client = ["solana-sdk", "no-entrypoint"]
solana-sdk = ["dep:solana-account"]
# Enables GPL-licensed parts of the code. See LICENSE file.
enable-gpl = []


[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi"] }
anchor-spl = { workspace = true }
arbitrary = { version = "~1.0", features = ["derive"], optional = true }
raydium-amm-v3 = { git = "ssh://git@github.com/jup-ag/raydium-clmm.git", rev = "225535ea74bb7aa3dd2c9fc99232f7a73af50e2c", features = [
    "no-entrypoint",
] }
arrayref = "0.3.6"
bytemuck = { version = "^1.7.2", features = ["derive", "min_const_generics"] }
borsh = "1"
default-env = "0.1.1"
derivative = "2.2.0"
fixed = { workspace = true, features = [
    "serde",
    "borsh",
    "debug-assert-in-release",
] }
itertools = "0.10.3"
num_enum = "0.5.1"
pyth-sdk-solana = { workspace = true }
solana-security-txt = "1.1.1"
solana-account = { workspace = true, optional = true }
solana-program = { workspace = true }
static_assertions = "1.1"
switchboard-solana = "0.30.4"

[dev-dependencies]
async-trait = "0.1.52"
base64 = "0.13.0"
log = "0.4"
env_logger = "0.9.0"
itertools = "0.10.3"
lazy_static = "1.4.0"
num = "0.4.0"
rand = "0.8.4"
solana-account = { workspace = true }
solana-commitment-config = { workspace = true }
solana-keypair = { workspace = true }
solana-program-test = { workspace = true }
solana-logger = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-error = { workspace = true }
spl-associated-token-account-interface = { workspace = true }
spl-token-interface = { workspace = true }
